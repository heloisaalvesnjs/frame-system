version: '3.9'

services:

  # ── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: frame_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: framesystem
      POSTGRES_USER: framesystem
      POSTGRES_PASSWORD: framesystem
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U framesystem']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: frame_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  # ── Evolution API (WhatsApp) ──────────────────────────────
  evolution:
    image: atendai/evolution-api:latest
    container_name: frame_evolution
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: frame-system-evo-key
      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://framesystem:framesystem@postgres:5432/framesystem
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      WEBHOOK_GLOBAL_ENABLED: 'false'
      LOG_LEVEL: ERROR
      LOG_COLOR: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - evolution_data:/evolution/instances

  # ── n8n (automações extras) ───────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: frame_n8n
    restart: unless-stopped
    ports:
      - '5678:5678'
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: framesystem
      DB_POSTGRESDB_USER: framesystem
      DB_POSTGRESDB_PASSWORD: framesystem
      N8N_BASIC_AUTH_ACTIVE: 'true'
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: frame2026
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  redis_data:
  evolution_data:
  n8n_data:
